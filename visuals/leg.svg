="460" y="376" font-size="17" fill="#23334a" text-anchor="start">t1</text><text x="700" y="376" font-size="17" fill="#23334a" text-anchor="start">t2</text><text x="45" y="420" font-size="17" fill="#23334a" text-anchor="start">Keep v1 as an earlier snapshot; a new extreme creates a new revision.</text></svg>