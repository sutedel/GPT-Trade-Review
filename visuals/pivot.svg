<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title" style="font-family:Arial,sans-serif"><title id="title">Synthetic conditional pivot, distinguishing extreme time from confirmation time</title><rect width="900" height="450" fill="#ffffff"/><text x="40" y="35" font-size="23" fill="#23334a" text-anchor="start">Conditional SELL pivot example · ATR = 10</text><line x1="85" y1="320" x2="820" y2="320" stroke="#52647b" stroke-width="2" stroke-dasharray=""/><line x1="85" y1="320" x2="85" y2="65" stroke="#52647b" stroke-width="2" stroke-dasharray=""/><line x1="85" y1="295" x2="810" y2="295" stroke="#d7dfe8" stroke-width="1" stroke-dasharray=""/><text x="68" y="301" font-size="17" fill="#23334a" text-anchor="end">100</text><line x1="85" y1="175" x2="810" y2="175" stroke="#d7dfe8" stroke-width="1" stroke-dasharray=""/><text x="68" y="181" font-size="17" fill="#23334a" text-anchor="end">116</text><line x1="85" y1="115" x2="810" y2="115" stroke="#d7dfe8" stroke-width="1" stroke-dasharray=""/><text x="68" y="121" font-size="17" fill="#23334a" text-anchor="end">124</text><polyline points="130,295 260,205 400,115 520,123 650,168" fill="none" stroke="#146c64" stroke-width="3" stroke-dasharray=""/><line x1="650" y1="115" x2="650" y2="175" stroke="#ab4b41" stroke-width="3" stroke-dasharray=""/><rect x="631" y="122.5" width="38" height="45" rx="4" fill="#e8c1ba" stroke="#ab4b41"/><text x="300" y="85" font-size="18" fill="#23334a" text-anchor="start">Extreme at t2</text><line x1="400" y1="115" x2="400" y2="320" stroke="#687d97" stroke-width="1" stroke-dasharray="5 4"/><line x1="650" y1="175" x2="650" y2="320" stroke="#687d97" stroke-width="1" stroke-dasharray="5 4"/><text x="300" y="350" font-size="17" fill="#23334a" text-anchor="start">t2: not yet confirmed</text><text x="610" y="379" font-size="17" fill="#23334a" text-anchor="start">t4: confirmation</text><text x="510" y="65" font-size="17" fill="#23334a" text-anchor="start">O=123  H=124</text><text x="510" y="90" font-size="17" fill="#23334a" text-anchor="start">L=116  C=117</text><text x="110" y="390" font-size="18" fill="#23334a" text-anchor="start">124 − 116 = 8 = 0.8 × ATR</text><text x="40" y="427" font-size="16" fill="#23334a" text-anchor="start">Assumed passed: flag, eligible leg distance, time ordering. No full detector replay.</text></svg>